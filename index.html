<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS-X // Frutiger Aero Edition</title>
    <style>
        :root {
            --sky-gradient: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #8fd3f4 100%);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.9);
            --primary-blue: #0066cc;
            --accent-green: #2ecc71;
            --text-color: #1a365d;
            --user-bubble: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
            --ai-bubble: linear-gradient(135deg, #ffffff 0%, #e0f2fe 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--sky-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            /* Patrón sutil estilo burbujas/cristal */
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.6) 0%, transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(132, 250, 176, 0.3) 0%, transparent 40%);
            pointer-events: none;
        }

        header {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 102, 204, 0.15);
            z-index: 10;
        }

        h1 {
            font-size: 1.4rem;
            letter-spacing: 1px;
            color: var(--primary-blue);
            text-shadow: 0 1px 2px rgba(255,255,255, 0.8);
            font-weight: 700;
        }

        .status {
            font-size: 0.85rem;
            color: #0b6623;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.6);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
            z-index: 1;
        }

        .message {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .user-message {
            background: var(--user-bubble);
            color: #113f23;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            background: var(--ai-bubble);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .input-container {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 25px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 12px;
            z-index: 10;
            box-shadow: 0 -4px 20px rgba(0, 102, 204, 0.08);
        }

        input[type="text"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #bce0fd;
            border-radius: 20px;
            padding: 12px 20px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-blue);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04), 0 0 10px rgba(0, 102, 204, 0.3);
            background: #ffffff;
        }

        button {
            background: linear-gradient(135deg, #0076ff 0%, #0055bb 100%);
            color: #ffffff;
            border: 1px solid #004499;
            padding: 0 28px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0, 118, 255, 0.3);
            text-shadow: 0 1px 1px rgba(0,0,0,0.2);
        }

        button:hover {
            background: linear-gradient(135deg, #0085ff 0%, #0062cc 100%);
            box-shadow: 0 6px 15px rgba(0, 118, 255, 0.4);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
        }

        .typing {
            font-style: italic;
            color: #2b547e;
            font-size: 0.85rem;
            padding-left: 25px;
            margin-bottom: 8px;
            font-weight: 500;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 NEXUS-X // Frutiger Aero OS</h1>
        <div class="status">
            <div class="status-dot"></div>
            SISTEMA FLUIDO ACTIVO
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            ¡Hola! Soy <strong>NEXUS-X</strong> optimizado con una interfaz lúcida y natural. ¿En qué puedo ayudarte el día de hoy?
        </div>
    </div>

    <div id="typingIndicator" class="typing" style="display: none;">Conectando con la biósfera de datos...</div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Escribe tu consulta..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">Enviar</button>
    </div>

    <script>
        // CONFIGURACIÓN DE LA API (Asegúrate de poner tu API Key válida aquí)
        const API_KEY = 'TU_API_KEY_DE_GEMINI_AQUI';
        const MODEL_NAME = 'gemini-1.5-flash';

        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const typingIndicator = document.getElementById('typingIndicator');

        // Permitir enviar con Enter
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (text === '') return;
            if (API_KEY === 'AQ.Ab8RN6KotljixmzEdVYWruhcC_YZmrwGlKwZctoNyzEXnK4wGA') {
                alert('Por favor, ingresa tu API Key de Gemini en el código JavaScript antes de chatear.');
                return;
            }

            // 1. Mostrar mensaje del usuario
            appendMessage(text, 'user-message');
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 2. Mostrar indicador de carga
            typingIndicator.style.display = 'block';

            try {
                // 3. Petición HTTP a la API de Gemini
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                parts: [
                                    { text: "Actúa como una inteligencia artificial avanzada, optimista, brillante y con un toque natural y sofisticado llamada NEXUS-X. Responde a esto: " + text }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                typingIndicator.style.display = 'none';

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    appendMessage(aiResponse, 'ai-message');
                } else {
                    appendMessage("Hubo una pequeña interrupción en la corriente de datos. Inténtalo de nuevo.", 'ai-message');
                }

            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage("Error de conexión con el servidor central.", 'ai-message');
                console.error(error);
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(text, className) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', className);
            messageDiv.innerHTML = text.replace(/\n/g, '<br>');
            chatContainer.appendChild(messageDiv);
        }
    </script>
</body>
</html>
