<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Completo de Roblox</title>
    <style>
        :root {
            --primary-color: #0070f3;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-inner: #0f172a;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
            --offline-color: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-color);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--card-inner);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 14px 22px;
            border-radius: 10px;
            border: none;
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0051b3;
        }

        .profile-card {
            display: none;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--card-inner);
            padding: 20px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .avatar-container {
            position: relative;
        }

        .avatar-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: var(--border-color);
            object-fit: cover;
            border: 3px solid var(--primary-color);
        }

        .status-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--card-inner);
        }

        .status-online { background-color: var(--success-color); }
        .status-offline { background-color: var(--offline-color); }

        .user-titles .display-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
        }

        .user-titles .username {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .profile-link {
            display: inline-block;
            font-size: 0.85rem;
            color: #38bdf8;
            text-decoration: none;
        }

        .profile-link:hover {
            text-decoration: underline;
        }

        .bio-box {
            background: var(--card-inner);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .bio-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .bio-content {
            font-size: 0.95rem;
            color: var(--text-color);
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 120px;
            overflow-y: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat-box {
            background: var(--card-inner);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 3px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .extra-info {
            background: var(--card-inner);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .extra-row {
            display: flex;
            justify-content: space-between;
        }

        .extra-label {
            color: var(--text-secondary);
        }

        .extra-value {
            color: var(--text-color);
            font-weight: 500;
        }

        .error-message {
            display: none;
            color: #f87171;
            font-size: 0.95rem;
            margin-top: 15px;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Perfil de Roblox</h1>
        
        <div class="search-box">
            <input type="text" id="usernameInput" placeholder="Escribe el usuario de Roblox..." autocomplete="off">
            <button id="searchBtn">Buscar</button>
        </div>

        <div id="errorMsg" class="error-message">No se encontr贸 al usuario o hubo un error al cargar los datos.</div>

        <div id="profileCard" class="profile-card">
            <!-- Cabecera con Avatar, Nombres y Link -->
            <div class="profile-header">
                <div class="avatar-container">
                    <img id="avatarImg" class="avatar-img" src="" alt="Avatar">
                    <div id="statusIndicator" class="status-badge"></div>
                </div>
                <div class="user-titles">
                    <div id="displayNameDisplay" class="display-name">Nombre de visualizaci贸n</div>
                    <div id="usernameDisplay" class="username">@usuario</div>
                    <a id="profileLink" class="profile-link" href="#" target="_blank">馃敆 Ver perfil oficial en Roblox</a>
                </div>
            </div>

            <!-- Descripci贸n (Bio) -->
            <div class="bio-box">
                <div class="bio-title">Descripci贸n</div>
                <div id="bioDisplay" class="bio-content">Sin descripci贸n.</div>
            </div>

            <!-- Estad铆sticas (Amigos, Seguidores, Seguidos) -->
            <div class="stats-grid">
                <div class="stat-box">
                    <div id="friendsCount" class="stat-value">0</div>
                    <div class="stat-label">Amigos</div>
                </div>
                <div class="stat-box">
                    <div id="followersCount" class="stat-value">0</div>
                    <div class="stat-label">Seguidores</div>
                </div>
                <div class="stat-box">
                    <div id="followingCount" class="stat-value">0</div>
                    <div class="stat-label">Siguiendo</div>
                </div>
            </div>

            <!-- Informaci贸n Adicional -->
            <div class="extra-info">
                <div class="extra-row">
                    <span class="extra-label">Fecha de creaci贸n:</span>
                    <span id="createdDate" class="extra-value">-</span>
                </div>
                <div class="extra-row">
                    <span class="extra-label">Estado de cuenta:</span>
                    <span id="accountStatus" class="extra-value" style="color: var(--success-color);">Activa</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const usernameInput = document.getElementById('usernameInput');
        const searchBtn = document.getElementById('searchBtn');
        const profileCard = document.getElementById('profileCard');
        const errorMsg = document.getElementById('errorMsg');

        // Elementos visuales
        const avatarImg = document.getElementById('avatarImg');
        const statusIndicator = document.getElementById('statusIndicator');
        const displayNameDisplay = document.getElementById('displayNameDisplay');
        const usernameDisplay = document.getElementById('usernameDisplay');
        const profileLink = document.getElementById('profileLink');
        const bioDisplay = document.getElementById('bioDisplay');
        const friendsCount = document.getElementById('friendsCount');
        const followersCount = document.getElementById('followersCount');
        const followingCount = document.getElementById('followingCount');
        const createdDate = document.getElementById('createdDate');
        const accountStatus = document.getElementById('accountStatus');

        async function fetchRobloxProfile() {
            const username = usernameInput.value.trim();
            if (!username) return;

            profileCard.style.display = 'none';
            errorMsg.style.display = 'none';

            try {
                // 1. Obtener ID de usuario mediante su nombre
                const userRes = await fetch('https://users.roblox.com/v1/usernames/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
                });
                const userDataJson = await userRes.json();

                if (!userDataJson.data || userDataJson.data.length === 0) {
                    errorMsg.textContent = 'No se encontr贸 ning煤n usuario con ese nombre.';
                    errorMsg.style.display = 'block';
                    return;
                }

                const basicInfo = userDataJson.data[0];
                const userId = basicInfo.id;
                const realUsername = basicInfo.name;
                const displayName = basicInfo.displayName;
                const isBanned = basicInfo.isBanned;

                if (isBanned) {
                    errorMsg.textContent = 'Esta cuenta se encuentra baneada o suspendida.';
                    errorMsg.style.display = 'block';
                    return;
                }

                // 2. Obtener la informaci贸n completa del perfil (Descripci贸n y fecha de creaci贸n)
                const profileRes = await fetch(`https://users.roblox.com/v1/users/${userId}`);
                const profileData = await profileRes.json();

                // 3. Obtener miniatura del Avatar (Cabeza/Logo)
                const avatarRes = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=true`);
                const avatarData = await avatarRes.json();
                const avatarUrl = avatarData.data?.[0]?.imageUrl || '';

                // 4. Obtener contadores (Amigos, Seguidores, Siguiendo)
                const [friendsRes, followersRes, followingRes] = await Promise.all([
                    fetch(`https://friends.roblox.com/v1/users/${userId}/friends/count`),
                    fetch(`https://friends.roblox.com/v1/users/${userId}/followers/count`),
                    fetch(`https://friends.roblox.com/v1/users/${userId}/followings/count`)
                ]);

                const friendsData = await friendsRes.json();
                const followersData = await followersRes.json();
                const followingData = await followingRes.json();

                // 5. Verificar si est谩 conectado (En l铆nea)
                const presenceRes = await fetch(`https://presence.roblox.com/v1/presence/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userIds: [userId] })
                });
                const presenceData = await presenceRes.json();
                const userPresence = presenceData.userPresences?.[0]?.userPresenceType;
                // userPresenceType: 0 (Offline), 1 (Online), 2 (In Game), 3 (In Studio)

                // Rellenar datos en la interfaz
                avatarImg.src = avatarUrl;
                displayNameDisplay.textContent = displayName;
                usernameDisplay.textContent = `@${realUsername}`;
                
                const profileUrl = `https://www.roblox.com/users/${userId}/profile`;
                profileLink.href = profileUrl;

                // Estado en l铆nea / offline
                if (userPresence > 0) {
                    statusIndicator.className = 'status-badge status-online';
                    statusIndicator.title = userPresence === 2 ? 'Jugando en un juego' : 'En l铆nea';
                } else {
                    statusIndicator.className = 'status-badge status-offline';
                    statusIndicator.title = 'Desconectado';
                }

                // Bio
                bioDisplay.textContent = profileData.description ? profileData.description : 'Este usuario no tiene descripci贸n.';

                // Contadores
                friendsCount.textContent = friendsData.count ?? 0;
                followersCount.textContent = followersData.count ?? 0;
                followingCount.textContent = followingData.count ?? 0;

                // Fecha de creaci贸n formateada
                const createdDateObj = new Date(profileData.created);
                createdDate.textContent = createdDateObj.toLocaleDateString('es-ES', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                profileCard.style.display = 'flex';

            } catch (error) {
                console.error(error);
                errorMsg.textContent = 'Hubo un error al consultar las API de Roblox.';
                errorMsg.style.display = 'block';
            }
        }

        searchBtn.addEventListener('click', fetchRobloxProfile);
        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchRobloxProfile();
        });
    </script>
</body>
</html>
