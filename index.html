<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Profile Dashboard</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}

:root{
  --bg:#0b0b0d;
  --sidebar:#111215;
  --panel:#191b1d;
  --panel-hover:#232527;
  --input-bg:#1c1d22;
  --border:#26282d;
  --text-muted:#8d9299;
  --green:#00a200;
  --green-hover:#008800;
  --roblox-card-bg:#16181c;
  --roblox-btn-bg:#2b2d32;
  --roblox-btn-hover:#383a40;
  --gold:#f39c12;
  --red:#e74c3c;
}

body{
  background:var(--bg);
  color:#ffffff;
  min-height:100vh;
  display:flex;
  overflow-x:hidden;
}

.custom-emoji {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9em;
  vertical-align: middle;
  font-style: normal;
}

.emoji-cash::before { content: "💵"; }
.icon-gem {
  width: 14px;
  height: 14px;
  display: inline-block;
  background: linear-gradient(135deg, #00f2fe, #4facfe);
  clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
  vertical-align: -2px;
  margin-right: 2px;
}

.icon-gift {
  width: 14px;
  height: 14px;
  display: inline-block;
  background: var(--gold);
  border-radius: 2px;
  position: relative;
  vertical-align: -2px;
  margin-right: 2px;
}
.icon-gift::after {
  content: "";
  position: absolute;
  background: #fff;
  top: 0; bottom: 0; left: 50%; width: 3px;
  transform: translateX(-50%);
}

.login-overlay{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:#050506;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10000;
}

.login-card{
  background:var(--panel);
  border:1px solid var(--border);
  width:90%;
  max-width:380px;
  padding:30px;
  border-radius:16px;
  text-align:center;
}

.avatar-preview-box{
  width:80px;
  height:80px;
  border-radius:50%;
  background:#22252c;
  margin:0 auto 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border:2px dashed var(--border);
  cursor:pointer;
}

.avatar-preview-box img{ width:100%; height:100%; object-fit:cover; display:none; }

.form-control{
  width:100%;
  background:var(--input-bg);
  border:1px solid var(--border);
  padding:10px 12px;
  border-radius:8px;
  color:#fff;
  font-size:13px;
  outline:none;
  margin-bottom:12px;
}

.btn-primary{
  width:100%;
  padding:12px;
  background:var(--green);
  border:0;
  border-radius:8px;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}

.app-container{
  display:none;
  width:100%;
  min-height:100vh;
}

.sidebar{
  width:80px;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 0;
  gap:20px;
  position:fixed;
  height:100vh;
  z-index: 100;
}

.sidebar-icon{
  width:24px;
  height:24px;
  fill:#fff;
  cursor:pointer;
  opacity:0.7;
  transition:0.2s;
  flex-shrink: 0;
  position: relative;
}

.sidebar-icon:hover{ opacity:1; }

.notification-badge-dot {
  position: absolute;
  top: -2px;
  right: -2px;
  background: var(--red);
  color: #fff;
  font-size: 9px;
  font-weight: 900;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--sidebar);
  display: none;
}

.main-layout{
  margin-left:80px;
  flex:1;
  display:block;
  min-height:100vh;
  position: relative;
}

.content-left{
  padding:30px;
  max-width:800px;
}

.sidebar-popup-panel {
  position: fixed;
  top: 0;
  right: -420px;
  width: 100%;
  max-width: 380px;
  height: 100vh;
  background: var(--sidebar);
  border-left: 1px solid var(--border);
  padding: 25px;
  z-index: 9999;
  box-shadow: -10px 0 30px rgba(0,0,0,0.7);
  transition: right 0.3s ease;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sidebar-popup-panel.active {
  right: 0;
}

.sidebar-popup-panel.wide-shop-panel {
  max-width: 600px;
  right: -620px;
}

.sidebar-popup-panel.wide-shop-panel.active {
  right: 0;
}

.popup-overlay-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(2px);
  z-index: 9998;
  display: none;
}

.popup-overlay-bg.active {
  display: block;
}

.profile-header-flex {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 24px;
}

.profile-avatar-large{
  width:120px;
  height:120px;
  border-radius:50%;
  border:3px solid var(--border);
  object-fit:cover;
  background:#222;
  flex-shrink: 0;
}

.profile-info-side {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}

.user-title-container{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 15px;
  width: 100%;
}

.user-title{
  font-size:24px;
  font-weight:900;
  word-break: break-all;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.badge-plus-tag {
  background: linear-gradient(135deg, #f39c12, #e67e22);
  color: #fff;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  box-shadow: 0 2px 6px rgba(243, 156, 18, 0.4);
}

.btn-logout{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text-muted);
  padding:6px 12px;
  border-radius:6px;
  font-size:12px;
  cursor:pointer;
  transition:0.2s;
  white-space: nowrap;
}

.btn-logout:hover{
  background:#c0392b;
  color:#fff;
  border-color:#c0392b;
}

.stat-box{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}

.stat-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:6px;
}

.stat-value{
  font-size:22px;
  font-weight:900;
  color:var(--green);
}

.account-info-card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
  margin-top:24px;
}

.info-header{
  font-weight:800;
  font-size:16px;
  margin-bottom:4px;
}

.info-sub{
  font-size:12px;
  color:var(--text-muted);
  margin-bottom:16px;
}

.desc-area{
  width:100%;
  background:var(--input-bg);
  border:1px solid var(--border);
  border-radius:8px;
  color:#fff;
  padding:10px;
  font-size:12px;
  resize:none;
  outline:none;
  margin-bottom:16px;
}

.friends-row{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:8px;
}

.friend-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  font-size:11px;
}

.friend-avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
}

.top-balance-container{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:24px;
}

.top-balance{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:6px;
  background:var(--panel);
  border:1px solid var(--border);
  padding:8px 16px;
  border-radius:20px;
  font-size:15px;
  font-weight:800;
}

.money-balance{
  color: var(--gold);
  border-color: rgba(243, 156, 18, 0.3);
}

.btn-code-redeem, .btn-withdraw{
  background: var(--green);
  color: #fff;
  border: 0;
  border-radius: 20px;
  padding: 10px 14px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: 0.2s;
}

.btn-withdraw{
  background: #e67e22;
}

.btn-withdraw:hover{
  background: #d35400;
}

.btn-code-redeem:hover{
  background: var(--green-hover);
}

.add-friends-section h3{
  font-size:14px;
  font-weight:800;
  margin-bottom:10px;
}

.search-box{
  position:relative;
}

.search-box input{
  width:100%;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:10px 36px 10px 14px;
  color:#fff;
  font-size:12px;
  outline:none;
}

.search-box span{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  opacity:0.5;
  cursor:pointer;
}

.autocomplete-list{
  position:absolute;
  top:100%;
  left:0;
  right:0;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  max-height:220px;
  overflow-y:auto;
  z-index:1000;
  margin-top:6px;
  display:none;
  box-shadow:0 8px 24px rgba(0,0,0,0.6);
  padding: 6px;
}

.autocomplete-item{
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  margin-bottom: 6px;
  transition: background 0.2s, border-color 0.2s;
}

.autocomplete-item:last-child{ margin-bottom:0; }

.autocomplete-item:hover{
  background: var(--panel-hover);
  border-color: var(--text-muted);
}

.autocomplete-item img{
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  border: 1px solid var(--border);
}

.missions-scroll-area{
  max-height: calc(100vh - 140px);
  overflow-y: auto;
  padding-right: 4px;
  display: flex;
  flex-direction: column;
}

.mission-card{
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.mission-info{
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.mission-title{
  font-size: 13px;
  font-weight: 800;
}

.mission-reward{
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 700;
}

.btn-action-mission{
  border: 0;
  padding: 7px 14px;
  border-radius: 6px;
  font-weight: 800;
  font-size: 11px;
  cursor: pointer;
  transition: 0.2s;
  white-space: nowrap;
  background: var(--roblox-btn-bg);
  color: #fff;
}

.btn-action-mission:hover{
  background: var(--roblox-btn-hover);
}

.btn-action-mission.green-btn{
  background: var(--green);
  color: #fff;
}
.btn-action-mission.green-btn:hover{
  background: var(--green-hover);
}

.shop-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.top-global-tabs{
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.top-tab-btn{
  background: var(--input-bg);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
}

.top-tab-btn.active{
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}

.top-item-row{
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--input-bg);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 8px;
  margin-bottom: 8px;
  font-size: 12px;
}

.top-user-info{
  display: flex;
  align-items: center;
  gap: 10px;
}

.top-user-info img{
  width: 30px;
  height: 30px;
  border-radius: 50%;
  object-fit: cover;
}

.top-rank-num{
  font-weight: 900;
  width: 20px;
  color: var(--gold);
}

.btn-add-friend {
  background: var(--green);
  color: #fff;
  border: 0;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.2s;
  width: 100%;
  margin-top: 12px;
}

.btn-add-friend:hover {
  background: var(--green-hover);
}

.btn-add-friend.pending {
  background: var(--roblox-btn-bg);
  color: var(--text-muted);
  cursor: default;
}

.btn-add-friend.friends {
  background: #34495e;
  color: #fff;
  cursor: default;
}

.notif-item {
  background: var(--input-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.notif-user-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.notif-user-info img {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  object-fit: cover;
}

.notif-actions {
  display: flex;
  gap: 6px;
}

.btn-accept-req {
  background: var(--green);
  color: #fff;
  border: 0;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}

.btn-reject-req {
  background: var(--red);
  color: #fff;
  border: 0;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}

@media (max-width: 768px) {
  body {
    flex-direction: column;
  }
  .sidebar {
    width: 100%;
    height: 60px;
    position: fixed;
    bottom: 0;
    top: auto;
    flex-direction: row;
    justify-content: flex-start;
    overflow-x: auto;
    padding: 0 15px;
    gap: 24px;
    border-right: none;
    border-top: 1px solid var(--border);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .sidebar::-webkit-scrollbar {
    display: none;
  }
  .main-layout {
    margin-left: 0;
    margin-bottom: 60px;
  }
  .content-left {
    padding: 15px;
    max-width: 100%;
  }
  .sidebar-popup-panel {
    top: auto;
    bottom: -100%;
    left: 50%;
    transform: translateX(-50%);
    right: auto;
    width: 92%;
    max-width: 420px;
    height: 80vh;
    max-height: 600px;
    border-radius: 24px 24px 0 0;
    border: 1px solid var(--border);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
    transition: bottom 0.35s cubic-bezier(0.1, 1, 0.1, 1);
  }
  .sidebar-popup-panel.active {
    bottom: 0;
    right: auto;
  }
  .sidebar-popup-panel.wide-shop-panel {
    width: 92%;
    max-width: 460px;
    right: auto;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginScreen">
  <div class="login-card">
    <h2 style="margin-bottom:6px;">Iniciar Sesión</h2>
    <p style="font-size:12px; color:var(--text-muted); margin-bottom:16px;">Ingresa para cargar tus datos en Firebase</p>

    <div class="avatar-preview-box" onclick="document.getElementById('loginAvatarFile').click()">
      <span id="uploadHint" style="font-size:10px; color:var(--text-muted);">Foto Avatar</span>
      <img id="avatarPreviewImg" alt="Preview">
    </div>

    <input type="file" id="loginAvatarFile" style="display:none;" accept="image/*">
    <input type="text" id="loginUsername" class="form-control" placeholder="Nombre de usuario (ej: darwinrbxtik)">

    <button class="btn-primary" id="btnLogin">Entrar al Perfil</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="app-container" id="appContainer">
  
  <aside class="sidebar">
    <svg class="sidebar-icon" id="iconMissionsMenu" viewBox="0 0 24 24" title="Misiones Diarias">
      <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
    </svg>

    <svg class="sidebar-icon" id="sidebarWithdrawBtn" viewBox="0 0 24 24" title="Retirar Robux y Conversión" style="fill: var(--gold);">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-1c-1.1 0-2-.9-2-2h2c0 .55.45 1 1 1s1-.45 1-1-.45-1-1-1c-1.66 0-3-1.34-3-3 0-1.1.9-2 2-2V7h2v1c1.1 0 2 .9 2 2h-2c0-.55-.45-1-1-1s-1 .45-1 1 .45 1 1 1c1.66 0 3 1.34 3 3 0 1.1-.9 2-2 2v1z"/>
    </svg>

    <svg class="sidebar-icon" id="iconTopGlobal" viewBox="0 0 24 24" title="Top Global" style="fill: #f1c40f;">
      <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
    </svg>

    <svg class="sidebar-icon" id="iconRobotShop" viewBox="0 0 24 24" title="Tienda de Robots">
      <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
    </svg>

    <!-- Icono de Lápiz para Editar Perfil -->
    <svg class="sidebar-icon" id="iconEditProfile" viewBox="0 0 24 24" title="Editar Perfil (Foto, Nombre y Descripción)">
      <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
    </svg>

    <!-- Icono de Notificaciones -->
    <svg class="sidebar-icon" id="iconNotifications" viewBox="0 0 24 24" title="Notificaciones de Amistad">
      <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
      <span class="notification-badge-dot" id="notifBadgeDot">0</span>
    </svg>

    <svg class="sidebar-icon" id="iconProfileCircle" viewBox="0 0 24 24" title="Abrir Panel de Saldos">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/>
    </svg>

    <svg class="sidebar-icon" id="openShopBtn" viewBox="0 0 24 24" title="Buscar Usuario">
      <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </svg>
  </aside>

  <div class="popup-overlay-bg" id="popupOverlayBg"></div>

  <!-- Panel de Edición de Perfil (Lápiz) -->
  <div class="sidebar-popup-panel" id="editProfilePanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <b style="font-size:18px; font-weight:900;">✏️ Editar Perfil</b>
